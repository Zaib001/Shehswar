version: '3.8'

services:
  # ------------------------------------------
  # Relational Database: PostgreSQL 16
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shehswar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: shehswar_one360
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shehswar_one360']
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # In-Memory Cache & Queue: Redis 7
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shehswar_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # S3 Compatible Object Storage: MinIO
  # ------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: shehswar_minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 3

  # ------------------------------------------
  # MinIO Bucket Auto-Provisioner
  # ------------------------------------------
  create-buckets:
    image: minio/mc:latest
    container_name: shehswar_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin miniopassword;
      /usr/bin/mc mb --ignore-existing local/shehswar-documents;
      /usr/bin/mc anonymous set download local/shehswar-documents;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
