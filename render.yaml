# ==============================================================================
# SHEHSWAR ONE360 - RENDER BLUEPRINT (INFRASTRUCTURE AS CODE)
# ==============================================================================
# One-click automated deployment for Shehswar ONE360 Enterprise ERP & CRM.
# Provisions:
#   1. Managed PostgreSQL Database (shehswar-db)
#   2. NestJS Backend REST API (shehswar-api) with auto-migration & admin seed
#   3. Next.js Enterprise Frontend (shehswar-web)
# ==============================================================================

databases:
  - name: shehswar-db
    databaseName: shehswar_one360
    user: shehswar_user
    plan: free
    region: oregon
    ipAllowList: [] # Open to Render internal network and authorized connections

services:
  # ----------------------------------------------------------------------------
  # 1. SHEHSWAR ONE360 - NestJS Backend REST API
  # ----------------------------------------------------------------------------
  - type: web
    name: shehswar-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:build:api
    startCommand: npm run render:start:api
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: shehswar-one360
      - key: DATABASE_URL
        fromDatabase:
          name: shehswar-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: ./uploads
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_PRETTY_LOG
        value: false

  # ----------------------------------------------------------------------------
  # 2. SHEHSWAR ONE360 - Next.js Enterprise Web Frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: shehswar-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:build:web
    startCommand: npm run render:start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "" # Uses relative same-origin API proxy via Next.js rewrites (zero CORS)
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: shehswar-api
          property: hostport
