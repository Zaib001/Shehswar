version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 (Local Database Engine)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shehswar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-shehswar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ShehswarSecure2026!}
      POSTGRES_DB: ${DB_NAME:-shehswar_one360}
    ports:
      - '5432:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-shehswar_user} -d ${DB_NAME:-shehswar_one360}']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis 7 (Caching & Queues)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shehswar_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. Shehswar NestJS API Backend
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: shehswar_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-shehswar_user}:${DB_PASSWORD:-ShehswarSecure2026!}@postgres:5432/${DB_NAME:-shehswar_one360}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-shehswar_enterprise_jwt_access_super_secret_key_2026_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-shehswar_enterprise_jwt_refresh_super_secret_key_2026_prod}
      CORS_ORIGIN: '*'

  # -------------------------------------------------------------
  # 4. Shehswar Next.js Web Frontend
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: shehswar_web
    restart: always
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
